# Empêche la mise en pause du projet Supabase gratuit (inactivité ~7 jours) :
# un ping de l'application et de l'API tous les 3 jours compte comme activité.
name: Keepalive Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
