<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Horaires</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  /* Palette inspirée de Jibble : vert principal, texte bleu marine, fond clair. */
  --bleu:#01a76b; --bleu-f:#047857; --fond:#f6f8fa; --carte:#ffffff;
  --texte:#132b46; --gris:#64748b; --ligne:#e4e9ee; --vert:#059669;
  --rouge:#dc2626; --ambre:#d97706; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--fond);color:var(--texte);min-height:100vh;font-size:16px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
.vue{max-width:520px;margin:0 auto;padding:16px 14px calc(60px + env(safe-area-inset-bottom))}
#v-admin{max-width:1080px}
h1{font-size:22px;font-weight:700}
.carte{background:var(--carte);border-radius:var(--r);box-shadow:0 1px 3px rgba(15,23,42,.08);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--bleu);color:#fff;
  border-radius:12px;padding:13px 18px;font-weight:600;transition:filter .12s}
.btn:active{filter:brightness(.9)}
.btn.sec{background:#e2e8f0;color:var(--texte)}
.btn.vert{background:var(--vert)}
.btn.rouge{background:#fee2e2;color:var(--rouge)}
.btn.large{width:100%;padding:15px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:default}
.muet{color:var(--gris);font-size:13px}

/* ---- Login ---- */
#v-login{max-width:360px;padding-top:9vh;text-align:center}
#v-login .logo{font-size:52px}
#v-login h1{margin:8px 0 2px}
#v-login .sous{color:var(--gris);margin-bottom:26px}
.pin-aff{display:flex;justify-content:center;gap:12px;height:18px;margin-bottom:8px}
.pin-aff i{width:14px;height:14px;border-radius:50%;background:#cbd5e1;transition:background .1s}
.pin-aff i.on{background:var(--bleu)}
.pin-aff .pin-vide{font-size:13px;color:#94a3b8;line-height:18px}
#login-err{color:var(--rouge);font-size:14px;min-height:20px;margin:6px 0 10px}
.pave{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.pave button{background:var(--carte);border-radius:16px;font-size:24px;font-weight:600;padding:16px 0;
  box-shadow:0 1px 3px rgba(15,23,42,.08)}
.pave button:active{background:#e2e8f0}
.pave .fant{background:none;box-shadow:none;font-size:20px}
#btn-login{margin-top:18px;width:100%;max-width:280px}

/* ---- Entêtes ---- */
.entete{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.entete .qui{font-size:19px;font-weight:700}
.entete .sous-qui{color:var(--gris);font-size:13px}
.ico{font-size:20px;padding:8px;border-radius:10px;background:var(--carte);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.nav-mois{display:flex;align-items:center;justify-content:space-between;background:var(--carte);
  border-radius:var(--r);box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:14px}
.nav-mois button{font-size:22px;padding:10px 20px;color:var(--bleu)}
.nav-mois .lib{font-weight:700;font-size:17px;text-transform:capitalize}

/* ---- Pointeur ---- */
#carte-pointer .btn{margin-top:4px}
#carte-pointer .heure-actuelle{font-variant-numeric:tabular-nums}

/* ---- Totaux ---- */
.totaux{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.totaux .gros{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#e7f6ef;color:var(--bleu-f)}
.etat-mois{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:11px 13px;border-radius:12px}
.etat-mois.attention{background:#fef3c7;color:#92400e}
.etat-mois.ok{background:#e7f6ef;color:#047857}
#btn-pointer{display:flex;flex-direction:column;gap:1px}
#btn-pointer .btn-sous{font-size:12.5px;font-weight:600;opacity:.92}

/* ---- Liste jours ---- */
.jour-ligne{display:flex;align-items:center;gap:12px;background:var(--carte);border-radius:12px;
  padding:10px 12px;margin-bottom:7px;box-shadow:0 1px 2px rgba(15,23,42,.06);width:100%;text-align:left}
.jour-ligne:active{background:#f8fafc}
.jour-ligne.we{background:#e9eef5;box-shadow:none}
.jour-ligne .date{width:46px;flex:none;text-align:center;line-height:1.15}
.jour-ligne .date .js{font-size:11px;text-transform:uppercase;color:var(--gris);font-weight:600}
.jour-ligne .date .num{font-size:19px;font-weight:700}
.jour-ligne.auj .date{color:var(--bleu)}
.jour-ligne.auj .date .js{color:var(--bleu)}
.jour-ligne.auj{outline:2px solid var(--bleu)}
.jour-ligne .contenu{flex:1;min-width:0}
.jour-ligne .heures-txt{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jour-ligne .rem{font-size:12px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jour-ligne .tot{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.jour-ligne .vide{color:#cbd5e1}
.jour-ligne.manque{border-left:4px solid var(--ambre)}
.plier{display:block;width:100%;text-align:center;font-size:13px;font-weight:600;color:var(--gris);
  padding:11px;margin:2px 0 8px;border:1px dashed #cbd5e1;border-radius:12px}
.plier:active{background:#eef2f5}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;margin-right:4px}
.okv{color:var(--vert);font-weight:800}
.val-jour{flex:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#94a3b8;background:#eef2f5;margin-left:8px;cursor:pointer}
.val-jour.on{background:var(--vert);color:#fff}
.sem-sub{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#334155;
  background:#eef3f1;border-radius:9px;padding:7px 12px;margin:2px 0 10px}
.delta-sup{font-size:11px;font-weight:800;color:#047857;margin-left:4px;white-space:nowrap}
.note-verrou{background:#ecfdf5;color:#065f46;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;text-align:center;margin-top:10px}
.btn-val{padding:6px 10px !important;font-size:12px !important}

/* ---- Modales ---- */
.voile{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:40}
.voile.ouvert{display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.voile.ouvert{align-items:center}}
.modale{background:var(--fond);width:100%;max-width:560px;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modale{border-radius:20px}}
.modale h2{font-size:18px;margin-bottom:12px;text-transform:capitalize}
.demi{background:var(--carte);border-radius:12px;padding:12px;margin-bottom:10px}
.demi .titre-demi{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
.entete-demi{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.entete-demi .titre-demi{margin-bottom:0}
select.statut{width:auto;margin-bottom:0;padding:8px 10px;border:1px solid var(--ligne);border-radius:10px;
  background:#f8fafc;font-size:14px;font-weight:600;color:var(--texte)}
.types{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.types button{flex:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;background:#f1f5f9;color:var(--gris)}
.types button.actif{background:var(--bleu);color:#fff}
.lignes-h{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.champ-h{display:flex;align-items:center;gap:4px;background:#f8fafc;border:1px solid var(--ligne);border-radius:10px;padding:4px 6px}
.champ-h label{font-size:11px;color:var(--gris);width:34px;flex:none}
.champ-h input[type=time]{border:none;background:none;flex:1;font-size:16px;min-width:0;padding:6px 0}
.champ-h .now{font-size:15px;padding:6px;color:var(--bleu)}
.modale .actions{display:flex;gap:8px;margin-top:14px}
.modale .actions .btn{flex:1}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--ligne);border-radius:10px;
  padding:11px 12px;background:var(--carte);margin-bottom:8px}
.total-apercu{text-align:center;font-weight:700;margin-top:2px}
.lbl{font-size:12px;font-weight:600;color:var(--gris);margin:6px 0 4px;display:block}

/* ---- Admin ---- */
.onglets{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.onglets button{flex:none;padding:9px 16px;border-radius:99px;font-weight:600;background:var(--carte);color:var(--gris);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.onglets button.actif{background:var(--bleu);color:#fff}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grille{border-collapse:collapse;width:100%;background:var(--carte);border-radius:var(--r);overflow:hidden;font-size:13px}
.grille th,.grille td{border:1px solid var(--ligne);padding:6px 8px;text-align:center;white-space:nowrap}
.grille th{background:#f8fafc;color:#334155;font-size:11px;line-height:1.2}
.grille td:first-child,.grille th:first-child{text-align:left;position:sticky;left:0;background:var(--carte);z-index:1}
.grille th:first-child{background:#f8fafc}
.grille th.we-th{background:#eef1f4;color:#94a3b8}
.grille th.auj-th{background:#e7f6ef;color:var(--bleu-f)}
.grille td.we-td{background:#f4f6f8}
.grille td.auj-td{background:#fffbeb}
.grille td.ok-td{background:#e9f9f1}
.grille td.manque-td{background:#fef7e6}
.grille td.cellule{cursor:pointer;font-variant-numeric:tabular-nums;font-size:11px;line-height:1.25;padding:4px 5px;min-width:38px}
.grille td.cellule:hover{outline:2px solid var(--bleu);outline-offset:-2px}
.tot-cell{font-weight:700;font-variant-numeric:tabular-nums}
.emp-nom-cell{font-weight:700}
.emp-lien{display:block;font-weight:700;color:var(--texte);text-align:left;padding:0;
  text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.btn-val-lien{display:block;font-size:11px;color:var(--bleu-f);font-weight:600;padding:2px 0;text-decoration:underline}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.val{background:#d1fae5;color:#065f46}
.pill.att{background:#fef3c7;color:#92400e}
.emp-carte{display:flex;align-items:center;justify-content:space-between;gap:10px}
.emp-carte .nom{font-weight:700}
.emp-carte.inactif{opacity:.55}
.exp-choix{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.exp-choix label{display:flex;align-items:center;gap:10px;font-weight:500}
.exp-choix input{width:20px;height:20px}
.pastille{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;
  background:var(--rouge);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.onglets button.actif .pastille{background:#fff;color:var(--rouge)}

/* ---- Messagerie direction ↔ fiduciaire ---- */
.fil{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bulle{max-width:88%;padding:10px 13px;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.bulle .qui-msg{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;opacity:.75}
.bulle .txt{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.bulle .quand{font-size:11px;color:var(--gris);margin-top:4px}
.bulle.moi{align-self:flex-end;background:#dcf5e9}
.bulle.eux{align-self:flex-start;background:var(--carte)}
.fil-vide{text-align:center;color:var(--gris);font-size:14px;padding:22px 10px}
#msg-texte{min-height:84px;resize:vertical;width:100%;border:1px solid var(--ligne);border-radius:10px;
  padding:11px 12px;background:var(--carte);margin-bottom:8px;font-family:inherit;font-size:15px}
.lecture-seule{background:#eef2f7;color:#334155;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120%);
  background:#0f172a;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;transition:transform .25s;z-index:99;max-width:92vw;text-align:center}
#toast.vu{transform:translateX(-50%) translateY(0)}
.centre{text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<div id="v-login" class="vue" hidden>
  <div class="logo">⏱️</div>
  <h1>Horaires</h1>
  <div class="sous">Entrez votre code PIN</div>
  <div class="pin-aff" id="pin-aff"></div>
  <div id="login-err"></div>
  <div class="pave" id="pave"></div>
  <button class="btn large" id="btn-login" disabled>Se connecter</button>
</div>

<!-- ============ EMPLOYÉ ============ -->
<div id="v-emp" class="vue" hidden>
  <div class="entete">
    <div>
      <div class="qui" id="emp-nom"></div>
      <div class="sous-qui" id="emp-metier"></div>
    </div>
    <button class="ico" id="btn-sortir-emp" title="Se déconnecter">🚪</button>
  </div>
  <div class="nav-mois">
    <button id="emp-prev">‹</button>
    <div class="lib" id="emp-mois-lib"></div>
    <button id="emp-next">›</button>
  </div>
  <div class="carte" id="carte-pointer" hidden>
    <div class="muet" id="pointer-info"></div>
    <button class="btn vert large" id="btn-pointer"></button>
  </div>
  <div class="carte" id="carte-mois">
    <div id="emp-etat"></div>
    <div class="chips" id="emp-chips"></div>
    <div id="emp-remplir"></div>
  </div>
  <div id="emp-liste"></div>
</div>

<!-- ============ ADMIN ============ -->
<div id="v-admin" class="vue" hidden>
  <div class="entete">
    <div>
      <div class="qui" id="adm-titre">Administration</div>
      <div class="sous-qui" id="adm-entreprise-lib"></div>
    </div>
    <button class="ico" id="btn-sortir-adm" title="Se déconnecter">🚪</button>
  </div>
  <div class="nav-mois">
    <button id="adm-prev">‹</button>
    <div class="lib" id="adm-mois-lib"></div>
    <button id="adm-next">›</button>
  </div>
  <div class="onglets">
    <button data-ong="equipe" class="actif">🗓️ Feuilles de temps</button>
    <button data-ong="employes">👥 Employés</button>
    <button data-ong="export">📤 Export comptable</button>
    <button data-ong="messages" id="ong-btn-messages">💬 Questions</button>
  </div>
  <div id="ong-equipe"></div>
  <div id="ong-employes" hidden></div>
  <div id="ong-export" hidden></div>
  <div id="ong-messages" hidden></div>
</div>

<!-- ============ MODALE JOUR ============ -->
<div class="voile" id="voile-jour">
  <div class="modale">
    <h2 id="mj-titre"></h2>
    <div class="muet" id="mj-emp" style="margin:-8px 0 10px"></div>
    <div class="demi">
      <div class="entete-demi"><span class="titre-demi">Matin</span><select id="mj-statut-m" class="statut"></select></div>
      <div class="lignes-h" id="mj-heures-m">
        <div class="champ-h"><label>Début</label><input type="time" id="mj-md"><button class="now" data-cible="mj-md" title="Maintenant">⏱</button></div>
        <div class="champ-h"><label>Fin</label><input type="time" id="mj-mf"><button class="now" data-cible="mj-mf" title="Maintenant">⏱</button></div>
      </div>
    </div>
    <div class="demi">
      <div class="entete-demi"><span class="titre-demi">Après-midi</span><select id="mj-statut-a" class="statut"></select></div>
      <div class="lignes-h" id="mj-heures-a">
        <div class="champ-h"><label>Début</label><input type="time" id="mj-ad"><button class="now" data-cible="mj-ad" title="Maintenant">⏱</button></div>
        <div class="champ-h"><label>Fin</label><input type="time" id="mj-af"><button class="now" data-cible="mj-af" title="Maintenant">⏱</button></div>
      </div>
    </div>
    <input type="text" id="mj-rem" placeholder="Remarque (chantier, client…)" maxlength="200">
    <div class="total-apercu" id="mj-total"></div>
    <div class="note-verrou" id="mj-verrou" hidden>✓ Validé par la direction — modification impossible</div>
    <div class="actions" id="mj-actions-1">
      <button class="btn sec" id="mj-defaut">Journée type</button>
      <button class="btn rouge" id="mj-suppr" hidden>Supprimer</button>
    </div>
    <div class="actions">
      <button class="btn vert" id="mj-approuver" hidden></button>
    </div>
    <div class="actions">
      <button class="btn sec" id="mj-annuler">Annuler</button>
      <button class="btn" id="mj-save">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ============ MODALE REVUE (direction : détail avant validation) ============ -->
<div class="voile" id="voile-det">
  <div class="modale">
    <h2 id="det-titre"></h2>
    <div class="muet" id="det-sous" style="margin:-8px 0 10px"></div>
    <div class="muet" style="margin:0 0 10px" id="det-aide">Touchez la coche ✓ à droite d’un jour pour le valider (ou le déverrouiller) individuellement. « Valider le mois » verrouille tout d’un coup.</div>
    <div class="carte" style="padding:12px">
      <div class="totaux"><div>Total du mois</div><div class="gros" id="det-total">0h00</div></div>
      <div class="chips" id="det-chips"></div>
    </div>
    <div id="det-liste"></div>
    <div class="actions">
      <button class="btn sec" id="det-fermer">Fermer</button>
      <button class="btn vert" id="det-valider" hidden></button>
    </div>
  </div>
</div>

<!-- ============ MODALE EMPLOYÉ (admin) ============ -->
<div class="voile" id="voile-emp">
  <div class="modale">
    <h2 id="me-titre">Employé</h2>
    <label class="lbl">Prénom</label>
    <input type="text" id="me-prenom" maxlength="60">
    <label class="lbl">Nom</label>
    <input type="text" id="me-nom" maxlength="60">
    <label class="lbl">Métier</label>
    <input type="text" id="me-metier" maxlength="60" placeholder="Sanitaire, Vitrerie…">
    <label class="lbl">Type d’accès</label>
    <select id="me-role">
      <option value="employe">Employé — saisit ses heures</option>
      <option value="compta">Fiduciaire / comptable — consulte et exporte</option>
    </select>
    <div id="me-champs-emp">
      <label class="lbl">Convention collective (majorations des heures supplémentaires)</label>
      <select id="me-cct">
        <option value="ferblanterie">Ferblanterie / installations sanitaires — 40 h/sem.</option>
        <option value="chauffage">Chauffage, climatisation et ventilation — 40 h/sem.</option>
        <option value="vitrerie">Vitrerie (second-œuvre) — 41 h/sem.</option>
      </select>
      <div class="muet" id="me-cct-info" style="margin:-2px 0 8px"></div>
      <label class="lbl">Journée type</label>
      <div class="lignes-h" style="margin-bottom:8px">
        <div class="champ-h"><label>Matin</label><input type="time" id="me-md"><span class="muet">→</span><input type="time" id="me-mf"></div>
        <div class="champ-h"><label>A-midi</label><input type="time" id="me-ad"><span class="muet">→</span><input type="time" id="me-af"></div>
      </div>
    </div>
    <label class="lbl">Nouveau code PIN (4 à 8 chiffres — laisser vide pour ne pas changer)</label>
    <input type="password" id="me-pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••••" autocomplete="new-password">

<script>
'use strict';
const CFG = { url: '__SUPABASE_URL__', key: '__ANON_KEY__' };

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JS_COURT = ['dim','lun','mar','mer','jeu','ven','sam'];
const JS_LONG = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const TYPES = {travail:'Travail', vacances:'Vacances', maladie:'Maladie', accident:'Accident', ferie:'Jour férié', armee:'Armée / PC', ecole:'Formation', conge_np:'Congé non payé', autre:'Autre'};
const BADGES = {vacances:'VAC', maladie:'MAL', accident:'ACC', ferie:'FÉR', armee:'MIL', ecole:'FOR', conge_np:'CNP', autre:'AUT'};
const COULEURS = {vacances:'#d97706', maladie:'#dc2626', accident:'#b91c1c', ferie:'#7c3aed', armee:'#0d9488', ecole:'#0284c7', conge_np:'#6b7280', autre:'#64748b'};

const parseT = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtMin = m => Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
// Notation de la comptable : 8:00, 25:00 (et non 8h00 / 25h00).
const fmtHM = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
const fmtSoldeHM = m => (m < 0 ? '−' : '+') + fmtHM(Math.abs(m));
// Valeur exacte (le format Excel '0.00' n'arrondit qu'à l'affichage) :
// la somme des cellules journalières correspond ainsi toujours au total.
const fmtDec = m => m / 60;
function demiMin(type, deb, fin) {
  if (type !== 'travail') return 0;
  const d = parseT(deb), f = parseT(fin);
  return (d != null && f != null && f > d) ? f - d : 0;
}
function jourMin(p) {
  if (!p) return 0;
  return demiMin(p.matin_type, p.matin_debut, p.matin_fin) + demiMin(p.apm_type, p.apm_debut, p.apm_fin);
}
/* Journée normale des employés : 8h00 dues par jour ouvré (lun-ven) écoulé.
   Une absence saisie (vacances, maladie…) neutralise sa demi-journée ;
   les jours futurs ne sont pas encore dus. Solde = heures pointées − dues. */
const BASE_JOUR_MIN = 8 * 60;
const fmtSolde = m => (m < 0 ? '−' : '+') + fmtMin(Math.abs(m));
function heuresDues(jours, map, baseMin) {
  const base = baseMin || BASE_JOUR_MIN;
  const auj = aujourdhui();
  let due = 0;
  for (const j of jours) {
    if (j.js === 0 || j.js === 6 || j.iso > auj || ferieGE(j.iso)) continue;
    const p = map[j.iso];
    let d = base;
    if (p) {
      if (p.matin_type !== 'travail') d -= base / 2;
      if (p.apm_type !== 'travail') d -= base / 2;
    }
    due += d;
  }
  return due;
}
function joursManquants(jours, map) {
  const auj = aujourdhui();
  return jours.filter(j => j.js >= 1 && j.js <= 5 && j.iso < auj && !map[j.iso] && !ferieGE(j.iso)).length;
}
/* Jours fériés officiels du canton de Genève, calculés pour n'importe quelle
   année (source : ge.ch — 9 jours) : 1er janvier, Vendredi saint, lundi de
   Pâques, Ascension, lundi de Pentecôte, 1er août, Jeûne genevois (jeudi qui
   suit le premier dimanche de septembre), Noël, 31 décembre (Restauration de
   la République). Pâques : algorithme de Gauss/Meeus. */
function paquesDim(an) {
  const a = an % 19, b = Math.floor(an / 100), c = an % 100,
    d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
    m = Math.floor((a + 11 * h + 22 * l) / 451),
    mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(an, mois - 1, jour);
}
const _feries = {};
function feriesGE(an) {
  if (_feries[an]) return _feries[an];
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const plus = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const p = paquesDim(an), m = {};
  m[an + '-01-01'] = 'Nouvel An';
  m[iso(plus(p, -2))] = 'Vendredi saint';
  m[iso(plus(p, 1))] = 'Lundi de Pâques';
  m[iso(plus(p, 39))] = 'Ascension';
  m[iso(plus(p, 50))] = 'Lundi de Pentecôte';
  m[an + '-08-01'] = 'Fête nationale';
  const d1 = new Date(an, 8, 1);
  m[an + '-09-' + String(1 + ((7 - d1.getDay()) % 7) + 4).padStart(2, '0')] = 'Jeûne genevois';
  m[an + '-12-25'] = 'Noël';
  m[an + '-12-31'] = 'Restauration de la République';
  return _feries[an] = m;
}
function ferieGE(isoJour) { return feriesGE(+isoJour.slice(0, 4))[isoJour] || null; }
function badgeFerie(nom) {
  return '<span class="badge" style="background:' + COULEURS.ferie + '">FÉR</span> <span class="muet">' + nom + '</span>';
}
/* Heures supplémentaires d'un jour saisi : tout ce qui dépasse la journée
   type (8h00, réduite de 4h00 par demi-journée d'absence). Le week-end et
   les jours fériés, tout ce qui est travaillé compte en heures sup. */
function heuresSupJour(p, iso, js) {
  if (!p) return 0;
  const min = jourMin(p);
  if (!min) return 0;
  let attendu = 0;
  if (js >= 1 && js <= 5 && !ferieGE(iso)) {
    if (p.matin_type === 'travail') attendu += BASE_JOUR_MIN / 2;
    if (p.apm_type === 'travail') attendu += BASE_JOUR_MIN / 2;
  }
  return Math.max(0, min - attendu);
}
/* Majorations conventionnelles, reprises de la table de référence du classeur
   de la fiduciaire (onglet « Paramètres ») : ferblanterie/sanitaire et
   chauffage relèvent de la CCT « Métiers techniques du bâtiment GE »,
   la vitrerie de la CCT « Second-œuvre romand, avenant GE ». Chaque heure
   travaillée tombe dans une seule catégorie ; en cas de cumul (nuit un
   dimanche par exemple), c'est le taux le plus élevé qui s'applique. */
const CCT_BRANCHES = {
  ferblanterie: {
    nom: 'Ferblanterie / installations sanitaires', conv: 'Métiers techniques du bâtiment GE',
    sem: 40, baseCct: 8 * 60, nuitFin: '06:00', plageDebut: '07:00', plageFin: '18:00', nuitDebut: '20:00',
    avant: 0.25, apres: 0.25, nuit: 0.75, samedi: 0.5, samediDes: '00:00', dimanche: 1, ferie: 1
  },
  chauffage: {
    nom: 'Chauffage, climatisation et ventilation', conv: 'Métiers techniques du bâtiment GE',
    sem: 40, baseCct: 8 * 60, nuitFin: '06:00', plageDebut: '07:00', plageFin: '18:00', nuitDebut: '20:00',
    avant: 0.25, apres: 0.25, nuit: 0.5, samedi: 0.5, samediDes: '00:00', dimanche: 0.5, ferie: 1
  },
  vitrerie: {
    nom: 'Vitrerie (second-œuvre)', conv: 'Second-œuvre romand, avenant GE',
    sem: 41, baseCct: 8 * 60 + 12, nuitFin: '06:00', plageDebut: '06:00', plageFin: '18:00', nuitDebut: '22:00',
    avant: 0, apres: 0, nuit: 1, samedi: 1, samediDes: '17:00', dimanche: 1, ferie: 1
  }
};
const cctDe = emp => CCT_BRANCHES[emp && emp.cct] || CCT_BRANCHES.ferblanterie;
const pourcent = t => (t * 100).toFixed(0) + ' %';
// Segments de travail effectif de la journée, en minutes depuis minuit.
function segmentsJour(p) {
  const s = [];
  if (!p) return s;
  for (const [t, d, f] of [[p.matin_type, p.matin_debut, p.matin_fin], [p.apm_type, p.apm_debut, p.apm_fin]]) {
    if (t !== 'travail') continue;
    const a = parseT(d), b = parseT(f);
    if (a != null && b != null && b > a) s.push([a, b]);
  }
  return s;
}
/* Ventilation d'une journée par catégorie de majoration, calquée sur les
   colonnes N à S du classeur de la fiduciaire. */
function majorationsJour(p, iso, js, c) {
  const vide = { avant: 0, apres: 0, nuit: 0, samedi: 0, dimanche: 0, ferie: 0 };
  const seg = segmentsJour(p);
  if (!seg.length) return vide;
  const nuitF = parseT(c.nuitFin), plageD = parseT(c.plageDebut),
        plageF = parseT(c.plageFin), nuitD = parseT(c.nuitDebut), samDes = parseT(c.samediDes);
  let total = 0, nuit = 0, avant = 0, apres = 0, sam = 0;
  for (const [a, b] of seg) {
    total += b - a;
    nuit += Math.max(0, Math.min(b, nuitF) - Math.min(a, nuitF))
          + Math.max(0, Math.max(b, nuitD) - Math.max(a, nuitD));
    avant += Math.max(0, Math.min(b, plageD) - Math.max(a, nuitF));
    apres += Math.max(0, Math.min(b, nuitD) - Math.max(a, plageF));
    sam += Math.max(0, Math.min(b, 24 * 60) - Math.max(a, samDes));
  }
  const estFerie = !!ferieGE(iso) || (p.matin_type === 'ferie' && p.apm_type === 'ferie');
  const estSam = js === 6, estDim = js === 0;
  if (estDim) {
    const n = c.nuit > c.dimanche ? nuit : 0;
    return { ...vide, nuit: n, dimanche: total - n };
  }
  if (estFerie) {
    const n = c.nuit > c.ferie ? nuit : 0;
    return { ...vide, nuit: n, ferie: total - n };
  }
  if (estSam) return { ...vide, nuit, samedi: Math.max(0, sam - nuit) };
  return { ...vide, avant, apres, nuit };
}
function heuresTexte(p) {
  const parts = [];
  for (const [t, d, f] of [[p.matin_type, p.matin_debut, p.matin_fin], [p.apm_type, p.apm_debut, p.apm_fin]]) {
    if (t !== 'travail') parts.push('<span class="badge" style="background:' + COULEURS[t] + '">' + BADGES[t] + '</span>');
    else if (d || f) parts.push((d || '?') + '–' + (f || '?'));
  }
  return parts.join(' · ') || '<span class="vide">—</span>';
}
function joursDuMois(an, mo) {
  const n = new Date(an, mo, 0).getDate(), arr = [];
  for (let d = 1; d <= n; d++) {
    const dt = new Date(an, mo - 1, d);
    arr.push({ iso: an + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'), num: d, js: dt.getDay() });
  }
  return arr;
}
const aujourdhui = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const maintenantHM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function nomComplet(e) { return [e.prenom, e.nom].filter(Boolean).join(' '); }

let toastTimer;
function toast(msg, duree) {
  const t = $('toast'); t.textContent = msg; t.classList.add('vu');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('vu'), duree || 2600);
}

/* ---------- API ---------- */
async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.key, Authorization: 'Bearer ' + CFG.key },
      body: JSON.stringify(args || {})
    });
  } catch (e) { throw new Error('Pas de connexion internet'); }
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.hint)) || 'Erreur serveur (' + r.status + ')');
  return j;
}

/* ---------- État ---------- */
const S = {
  token: localStorage.getItem('hor_token') || null,
  moi: JSON.parse(localStorage.getItem('hor_moi') || 'null'),
  annee: new Date().getFullYear(),
  mois: new Date().getMonth() + 1,
  pointages: [], employes: [], entreprise: '',
  ongletAdmin: 'equipe',
  deplieAvant: false, deplieApres: false,
  // Accès fiduciaire : consultation seule, et fil de questions du mois.
  lecture: false, msgNonLus: 0, messages: [], msgCharges: false
};
const estCompta = () => !!(S.moi && S.moi.role === 'compta');
function ptgMap() {
  const m = {};
  for (const p of S.pointages) { (m[p.employe_id] = m[p.employe_id] || {})[p.jour] = p; }
  return m;
}
function sessionPerdue() {
  localStorage.removeItem('hor_token'); localStorage.removeItem('hor_moi');
  S.token = null; S.moi = null; S.lecture = false;
  $('voile-jour').classList.remove('ouvert');
  $('voile-emp').classList.remove('ouvert');
  $('voile-det').classList.remove('ouvert');
  montrer('login');
  const cle = cleDansUrl();
  if (cle && !cleEssayee) { connexionParCle(cle); return; }
  toast('Session expirée, reconnectez-vous');
}

/* ---------- Vues ---------- */
function montrer(vue) {
  $('v-login').hidden = vue !== 'login';
  $('v-emp').hidden = vue !== 'emp';
  $('v-admin').hidden = vue !== 'admin';
}

/* ---------- Connexion ---------- */
let pinBuf = '';
function initLogin() {
  const pave = $('pave');
  const touches = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
  pave.innerHTML = touches.map(t => '<button data-t="' + t + '" class="' + (t === 'C' || t === '⌫' ? 'fant' : '') + '">' + t + '</button>').join('');
  pave.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const t = b.dataset.t;
    if (t === '⌫') pinBuf = pinBuf.slice(0, -1);
    else if (t === 'C') pinBuf = '';
    else if (pinBuf.length < 8) pinBuf += t;
    renderPin();
  });
  document.addEventListener('keydown', e => {
    if ($('v-login').hidden) return;
    if (/^[0-9]$/.test(e.key) && pinBuf.length < 8) { pinBuf += e.key; renderPin(); }
    else if (e.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); renderPin(); }
    else if (e.key === 'Enter' && pinBuf.length >= 4) connexion();
  });
  $('btn-login').addEventListener('click', connexion);
  renderPin();
}
function renderPin() {
  $('pin-aff').innerHTML = pinBuf.length
    ? Array.from({ length: pinBuf.length }, () => '<i class="on"></i>').join('')
    : '<span class="pin-vide">Code PIN de 4 à 8 chiffres</span>';
  $('btn-login').disabled = pinBuf.length < 4;
  $('login-err').textContent = '';
}
let connexionEnCours = false;
async function connexion() {
  if (connexionEnCours || pinBuf.length < 4) return;
  connexionEnCours = true;
  $('btn-login').disabled = true;
  $('btn-login').innerHTML = '<span class="spin"></span>';
  try {
    const res = await rpc('connexion', { p_pin: pinBuf });
    if (!res.ok) { pinBuf = ''; renderPin(); $('login-err').textContent = res.erreur; return; }
    S.token = res.token; S.moi = res.employe;
    localStorage.setItem('hor_token', S.token);
    localStorage.setItem('hor_moi', JSON.stringify(S.moi));
    pinBuf = ''; renderPin();
    const d = new Date(); S.annee = d.getFullYear(); S.mois = d.getMonth() + 1;
    await charger();
  } catch (e) { $('login-err').textContent = e.message; }
  finally { connexionEnCours = false; $('btn-login').textContent = 'Se connecter'; $('btn-login').disabled = pinBuf.length < 4; }
}
/* Connexion par lien personnel : la clé voyage dans le fragment (#c=…),
   jamais envoyée au serveur web, seulement à l'API pour ouvrir la session. */
let cleEssayee = false;
async function connexionParCle(cle) {
  cleEssayee = true;
  montrer('login');
  $('btn-login').disabled = true;
  $('btn-login').innerHTML = '<span class="spin"></span>';
  try {
    const res = await rpc('connexion_cle', { p_cle: cle });
    if (!res.ok) { $('login-err').textContent = res.erreur; return; }
    S.token = res.token; S.moi = res.employe;
    localStorage.setItem('hor_token', S.token);
    localStorage.setItem('hor_moi', JSON.stringify(S.moi));
    const d = new Date(); S.annee = d.getFullYear(); S.mois = d.getMonth() + 1;
    await charger();
  } catch (e) { $('login-err').textContent = e.message; }
  finally { $('btn-login').textContent = 'Se connecter'; $('btn-login').disabled = pinBuf.length < 4; }
}
function cleDansUrl() {
  const m = (location.hash || '').match(/c=([0-9a-f]{32})/);
  return m ? m[1] : null;
}
async function deconnexion() {
  try { await rpc('deconnexion', { p_token: S.token }); } catch (e) {}
  localStorage.removeItem('hor_token'); localStorage.removeItem('hor_moi');
  S.token = null; S.moi = null; montrer('login');
}

/* ---------- Chargement ---------- */
let chargeSeq = 0;
async function charger() {
  const seq = ++chargeSeq;
  try {
    if (S.moi.role === 'admin' || S.moi.role === 'compta') {
      const compta = S.moi.role === 'compta';
      const res = await rpc(compta ? 'compta_donnees' : 'admin_donnees',
        { p_token: S.token, p_annee: S.annee, p_mois: S.mois });
      if (seq !== chargeSeq) return;
      if (!res.ok) { if (res.erreur === 'session') return sessionPerdue(); toast(res.erreur); return; }
      S.employes = res.employes; S.pointages = res.pointages; S.entreprise = res.entreprise || '';
      S.lecture = compta;
      S.msgNonLus = res.msg_non_lus || 0;
      if (compta && res.moi) { S.moi = res.moi; localStorage.setItem('hor_moi', JSON.stringify(S.moi)); }
      montrer('admin'); renderAdmin();
      if (S.ongletAdmin === 'messages') chargerMessages();
    } else {
      const res = await rpc('mes_pointages', { p_token: S.token, p_annee: S.annee, p_mois: S.mois });
      if (seq !== chargeSeq) return;
      if (!res.ok) { if (res.erreur === 'session') return sessionPerdue(); toast(res.erreur); return; }
      S.moi = res.employe; localStorage.setItem('hor_moi', JSON.stringify(S.moi));
      S.pointages = res.pointages.map(p => ({ ...p, employe_id: S.moi.id }));
      montrer('emp'); renderEmp();
    }
  } catch (e) { toast(e.message); }
}
function moisNav(delta) {
  S.mois += delta;
  if (S.mois > 12) { S.mois = 1; S.annee++; }
  if (S.mois < 1) { S.mois = 12; S.annee--; }
  S.deplieAvant = false; S.deplieApres = false;
  S.messages = []; S.msgCharges = false; // chaque mois a son propre fil de questions
  charger();
}

/* ---------- Résumé absences ---------- */
function resumeAbsences(ptgs) {
  const cnt = {};
  for (const p of ptgs) {
    for (const t of [p.matin_type, p.apm_type]) {
      if (t !== 'travail') cnt[t] = (cnt[t] || 0) + 0.5;
    }
  }
  return cnt;
}
const fmtJours = n => (n % 1 === 0 ? n : n.toFixed(1).replace('.', ',')) + ' j';

/* ---------- Vue employé ---------- */
function renderEmp() {
  $('emp-nom').textContent = 'Bonjour ' + S.moi.prenom + ' 👋';
  $('emp-metier').textContent = S.moi.metier || '';
  $('emp-mois-lib').textContent = MOIS[S.mois - 1] + ' ' + S.annee;
  const map = (ptgMap()[S.moi.id]) || {};
  const jours = joursDuMois(S.annee, S.mois);
  const auj = aujourdhui();

  // Côté employé, pas de total mensuel ni de solde (ils restent côté direction
  // et dans l'export) : ce qui lui parle, c'est « reste-t-il des jours à saisir ? ».
  const abs = resumeAbsences(S.pointages);
  const manq = joursManquants(jours, map);
  let supMois = 0;
  for (const p of S.pointages) {
    const [aS, mS, dS] = p.jour.split('-').map(Number);
    supMois += heuresSupJour(p, p.jour, new Date(aS, mS - 1, dS).getDay());
  }
  const moisCommence = jours[0].iso <= auj;
  $('emp-etat').innerHTML = manq > 0
    ? '<div class="etat-mois attention">⚠ ' + manq + ' jour' + (manq > 1 ? 's' : '') + ' à compléter</div>'
    : (moisCommence ? '<div class="etat-mois ok">✓ Vos heures sont à jour</div>' : '');
  let chips = '';
  if (supMois) chips += '<span style="background:#e7f6ef;color:#047857">Heures sup : +' + fmtMin(supMois) + '</span>';
  chips += Object.entries(abs).map(([t, n]) => '<span>' + TYPES[t] + ' : ' + fmtJours(n) + '</span>').join('');
  if (S.pointages.length && S.pointages.every(p => p.approuve)) {
    chips += '<span style="background:#ecfdf5;color:#065f46">✓ Validé par la direction</span>';
  }
  $('emp-chips').innerHTML = chips;
  $('emp-remplir').innerHTML = manq > 0
    ? '<button class="btn sec large" id="btn-remplir" style="margin-top:10px">✓ Compléter les ' + manq +
      ' jour' + (manq > 1 ? 's' : '') + ' manquant' + (manq > 1 ? 's' : '') + ' avec l’horaire normal</button>'
    : '';
  if (manq > 0) $('btn-remplir').addEventListener('click', remplirManquants);
  $('carte-mois').hidden = !$('emp-etat').innerHTML && !chips && manq === 0;

  // Carte du jour : un appui enregistre l'horaire normal de la journée en cours.
  const maintenant = new Date();
  const moisCourant = maintenant.getFullYear() === S.annee && (maintenant.getMonth() + 1) === S.mois;
  $('carte-pointer').hidden = !moisCourant;
  if (moisCourant) {
    const p = map[auj] || null;
    const lib = (S.moi.matin_debut_def || '08:00') + '–' + (S.moi.matin_fin_def || '12:00') +
      ' · ' + (S.moi.apm_debut_def || '13:00') + '–' + (S.moi.apm_fin_def || '17:00');
    const [anj, moj, jrj] = auj.split('-').map(Number);
    const jsAuj = new Date(anj, moj - 1, jrj).getDay();
    const dateLib = JS_LONG[jsAuj] + ' ' + jrj + ' ' + MOIS[moj - 1];
    if (p && p.approuve) {
      $('btn-pointer').disabled = true;
      $('btn-pointer').textContent = '✓ Journée validée par la direction';
      $('pointer-info').textContent = dateLib;
    } else if (p) {
      const min = jourMin(p);
      $('btn-pointer').disabled = true;
      $('btn-pointer').textContent = '✓ Journée d’aujourd’hui enregistrée' + (min ? ' · ' + fmtMin(min) : '');
      $('pointer-info').textContent = dateLib + ' — pour corriger, touchez le jour dans la liste.';
    } else if (ferieGE(auj)) {
      $('btn-pointer').disabled = true;
      $('btn-pointer').textContent = '🎉 ' + ferieGE(auj);
      $('pointer-info').textContent = 'Jour férié officiel à Genève — rien à saisir, la journée est créditée automatiquement.';
    } else {
      $('btn-pointer').disabled = false;
      $('btn-pointer').innerHTML = '<span>Enregistrer ma journée d’aujourd’hui</span>' +
        '<span class="btn-sous">' + lib + '</span>';
      $('pointer-info').textContent = dateLib + ' — horaire différent ou absence ? Touchez le jour dans la liste.';
    }
  }

  const ligneJour = j => {
    const p = map[j.iso];
    const we = j.js === 0 || j.js === 6;
    const min = jourMin(p);
    const fer = ferieGE(j.iso);
    const manque = !p && !we && j.iso < auj && !fer;
    return '<button class="jour-ligne ' + (we ? 'we' : '') + (j.iso === auj ? ' auj' : '') + (manque ? ' manque' : '') + '" data-jour="' + j.iso + '">' +
      '<div class="date"><div class="js">' + JS_COURT[j.js] + '</div><div class="num">' + j.num + '</div></div>' +
      '<div class="contenu"><div class="heures-txt">' + (p ? heuresTexte(p) : (fer ? badgeFerie(fer) : '<span class="vide">—</span>')) + '</div>' +
      (p && p.remarque ? '<div class="rem">' + esc(p.remarque) + '</div>' : '') + '</div>' +
      '<div class="tot">' + (p && p.approuve ? '<span class="okv">✓</span> ' : '') + (min ? fmtMin(min) : '') +
      (heuresSupJour(p, j.iso, j.js) ? ' <span class="delta-sup">+' + fmtMin(heuresSupJour(p, j.iso, j.js)) + '</span>' : '') +
      '</div></button>';
  };
  // Insère un sous-total (heures + heures sup) à la fin de chaque semaine.
  const avecSemaines = (liste, cloture) => {
    let html = '', sMin = 0, sSup = 0, sDebut = null;
    for (const j of liste) {
      const p = map[j.iso];
      if (sDebut === null) sDebut = j.num;
      sMin += jourMin(p);
      sSup += heuresSupJour(p, j.iso, j.js);
      html += ligneJour(j);
      if (j.js === 0 || (cloture && j === liste[liste.length - 1])) {
        if (sMin > 0) {
          html += '<div class="sem-sub"><span>Semaine ' + sDebut + '–' + j.num + '</span><span>' + fmtMin(sMin) +
            (sSup ? ' <span class="delta-sup">dont +' + fmtMin(sSup) + ' sup</span>' : '') + '</span></div>';
        }
        sMin = 0; sSup = 0; sDebut = null;
      }
    }
    return html;
  };
  let htmlListe;
  if (moisCourant) {
    // Aujourd'hui toujours en avant ; les autres jours se déplient à la demande.
    const avant = jours.filter(j => j.iso < auj);
    const apres = jours.filter(j => j.iso > auj);
    const jAuj = jours.find(j => j.iso === auj);
    const nSaisis = avant.filter(j => map[j.iso]).length;
    htmlListe = '';
    if (avant.length) {
      htmlListe += '<button class="plier" id="plier-avant">' +
        (S.deplieAvant ? '▾ Masquer les jours précédents'
                       : '▸ Jours précédents (1–' + (jAuj.num - 1) + ' ' + MOIS[S.mois - 1] + ' · ' +
                         nSaisis + ' saisi' + (nSaisis > 1 ? 's' : '') +
                         (manq ? ' · <span style="color:#b45309">⚠ ' + manq + ' à compléter</span>' : '') + ')') + '</button>';
      if (S.deplieAvant) htmlListe += avecSemaines(avant, false);
    }
    if (jAuj) htmlListe += ligneJour(jAuj);
    if (apres.length) {
      htmlListe += '<button class="plier" id="plier-apres">' +
        (S.deplieApres ? '▾ Masquer les jours suivants'
                       : '▸ Jours suivants (' + (jAuj.num + 1) + '–' + jours.length + ' ' + MOIS[S.mois - 1] + ')') + '</button>';
      if (S.deplieApres) htmlListe += apres.map(ligneJour).join('');
    }
  } else {
    htmlListe = avecSemaines(jours, true);
  }
  $('emp-liste').innerHTML = htmlListe;
  $('emp-liste').querySelectorAll('.jour-ligne').forEach(b =>
    b.addEventListener('click', () => ouvrirJour(S.moi.id, b.dataset.jour)));
  const pa = $('plier-avant');
  if (pa) pa.addEventListener('click', () => { S.deplieAvant = !S.deplieAvant; renderEmp(); });
  const pp = $('plier-apres');
  if (pp) pp.addEventListener('click', () => { S.deplieApres = !S.deplieApres; renderEmp(); });
}

async function remplirManquants() {
  const jours = joursDuMois(S.annee, S.mois);
  const map = ptgMap()[S.moi.id] || {};
  const auj = aujourdhui();
  const cibles = jours.filter(j => j.js >= 1 && j.js <= 5 && j.iso < auj && !map[j.iso] && !ferieGE(j.iso));
  if (!cibles.length) return;
  const lib = (S.moi.matin_debut_def || '08:00') + '–' + (S.moi.matin_fin_def || '12:00') +
    ' · ' + (S.moi.apm_debut_def || '13:00') + '–' + (S.moi.apm_fin_def || '17:00');
  if (!confirm('Remplir ' + cibles.length + ' jour(s) ouvré(s) avec la journée type (' + lib + ') ?\nVous pourrez corriger chaque jour ensuite.')) return;
  const btn = $('btn-remplir');
  if (btn) { btn.disabled = true; btn.textContent = 'Remplissage en cours…'; }
  try {
    for (const j of cibles) {
      const res = await rpc('enregistrer_jour', {
        p_token: S.token, p_jour: j.iso,
        p_matin_type: 'travail',
        p_matin_debut: S.moi.matin_debut_def || '08:00', p_matin_fin: S.moi.matin_fin_def || '12:00',
        p_apm_type: 'travail',
        p_apm_debut: S.moi.apm_debut_def || '13:00', p_apm_fin: S.moi.apm_fin_def || '17:00',
        p_remarque: ''
      });
      if (!res.ok) { if (res.erreur === 'session') return sessionPerdue(); toast(res.erreur, 3500); break; }
    }
    toast('✓ Jours complétés avec la journée type');
  } catch (e) { toast(e.message); }
  await charger();
}
async function journeeTypeAujourdhui() {
  const auj = aujourdhui();
  if ((ptgMap()[S.moi.id] || {})[auj]) return; // déjà saisi : on ne remplace rien
  const args = {

const MJ = { empId: null, jour: null, matin: 'travail', apm: 'travail', existe: false, approuve: false, verrou: false };
// Les absences sont regroupées dans un menu « Statut » : par défaut, seule la
// présence normale (les heures) est visible.
function initStatuts() {

function majStatuts() {
  $('mj-statut-m').value = MJ.matin;
  $('mj-statut-a').value = MJ.apm;

function majTotalApercu() {
  const min = demiMin(MJ.matin, $('mj-md').value, $('mj-mf').value) + demiMin(MJ.apm, $('mj-ad').value, $('mj-af').value);
  $('mj-total').textContent = min ? 'Total : ' + fmtMin(min) : '';
}
function ouvrirJour(empId, jour) {
  const p = (ptgMap()[empId] || {})[jour] || null;
  const admin = S.moi.role === 'admin';
  MJ.empId = empId; MJ.jour = jour; MJ.existe = !!p;
  MJ.approuve = !!(p && p.approuve);
  MJ.verrou = MJ.approuve && !admin;
  MJ.matin = p ? p.matin_type : 'travail';
  MJ.apm = p ? p.apm_type : 'travail';
  const [an, mo, jr] = jour.split('-').map(Number);
  const js = new Date(an, mo - 1, jr).getDay();
  $('mj-titre').textContent = JS_LONG[js] + ' ' + jr + ' ' + MOIS[mo - 1] + ' ' + an;
  const e = admin ? S.employes.find(x => x.id === empId) : S.moi;
  const ferJour = ferieGE(jour);
  const infosJour = [];
  if (admin && e) infosJour.push(nomComplet(e));
  if (ferJour) infosJour.push('🎉 Jour férié officiel : ' + ferJour);
  $('mj-emp').textContent = infosJour.join(' · ');
  $('mj-md').value = p ? (p.matin_debut || '') : '';
  $('mj-mf').value = p ? (p.matin_fin || '') : '';
  $('mj-ad').value = p ? (p.apm_debut || '') : '';
  $('mj-af').value = p ? (p.apm_fin || '') : '';
  $('mj-rem').value = p ? (p.remarque || '') : '';
  ['mj-md', 'mj-mf', 'mj-ad', 'mj-af', 'mj-rem', 'mj-statut-m', 'mj-statut-a'].forEach(id => { $(id).disabled = MJ.verrou; });
  // Jour ouvré vide : la présence normale est déjà proposée, il n'y a plus qu'à enregistrer.
  if (!p && !MJ.verrou && js >= 1 && js <= 5 && !ferJour) {
    $('mj-md').value = defPour('mj-md');
    $('mj-mf').value = defPour('mj-mf');
    $('mj-ad').value = defPour('mj-ad');
    $('mj-af').value = defPour('mj-af');
  }
  $('mj-suppr').hidden = !p || MJ.verrou;
  $('mj-defaut').hidden = MJ.verrou;
  $('mj-defaut').textContent = 'Journée type (' + defPour('mj-md') + '–' + defPour('mj-mf') +
    ' · ' + defPour('mj-ad') + '–' + defPour('mj-af') + ')';
  $('mj-save').hidden = MJ.verrou;
  $('mj-verrou').hidden = !MJ.verrou;
  const btnApp = $('mj-approuver');
  if (admin && p) {
    btnApp.hidden = false;
    btnApp.textContent = MJ.approuve ? '🔓 Déverrouiller ce jour' : '✓ Valider ce jour (direction)';
  } else { btnApp.hidden = true; }
  majStatuts();
  $('voile-jour').classList.add('ouvert');
}
function fermerJour() { $('voile-jour').classList.remove('ouvert'); }

function defPour(champ) {

  }[champ];

}

/* ---------- Questions de la fiduciaire (fil par mois) ---------- */
async function chargerMessages() {
  try {
    const res = await rpc('messages_lire', { p_token: S.token, p_annee: S.annee, p_mois: S.mois });
    if (!res.ok) { if (res.erreur === 'session') return sessionPerdue(); toast(res.erreur); return; }
    S.messages = res.messages; S.msgNonLus = res.non_lus; S.msgCharges = true;
    if (S.ongletAdmin === 'messages') renderMessages();
    $('ong-btn-messages').innerHTML = '💬 Questions' +
      (S.msgNonLus ? '<span class="pastille">' + S.msgNonLus + '</span>' : '');
  } catch (e) { toast(e.message); }
}
function renderMessages() {
  const moiRole = S.moi.role;
  const brouillon = $('msg-texte') ? $('msg-texte').value : ''; // un rafraîchissement n'efface pas ce qu'on est en train d'écrire
  const fil = S.msgCharges
    ? (S.messages.length
        ? S.messages.map(m => {
            const libRole = m.role === 'compta' ? 'fiduciaire' : 'direction';
            const qui = m.auteur.toLowerCase().includes(libRole) ? m.auteur : m.auteur + ' · ' + libRole;
            return '<div class="bulle ' + (m.role === moiRole ? 'moi' : 'eux') + '">' +
            '<div class="qui-msg">' + esc(qui) + '</div>' +
            '<div class="txt">' + esc(m.texte) + '</div>' +
            '<div class="quand">' + esc(m.quand) + '</div></div>';
          }).join('')
        : '<div class="fil-vide">Aucune question pour ' + MOIS[S.mois - 1] + ' ' + S.annee + '.<br>' +
          (estCompta() ? 'Posez ici vos questions sur ce mois : la direction y répond directement.'
                       : 'Les questions de la fiduciaire sur ce mois apparaîtront ici.') + '</div>')
    : '<div class="fil-vide">Chargement…</div>';
  $('ong-messages').innerHTML =
    '<div class="carte"><div style="font-weight:700;margin-bottom:4px">Questions sur ' +
      MOIS[S.mois - 1] + ' ' + S.annee + '</div>' +
    '<div class="muet" style="margin-bottom:12px">Chaque mois a son propre fil : changez de mois en haut pour retrouver les échanges correspondants.</div>' +
    '<div class="fil">' + fil + '</div>' +
    '<textarea id="msg-texte" maxlength="2000" placeholder="' +
      (estCompta() ? 'Votre question à la direction sur ce mois…' : 'Votre réponse à la fiduciaire…') + '"></textarea>' +
    '<button class="btn large" id="msg-envoyer">Envoyer</button></div>';
  $('msg-texte').value = brouillon;
  $('msg-envoyer').addEventListener('click', envoyerMessage);
  if (!S.msgCharges) chargerMessages();
}
async function envoyerMessage() {
  const texte = $('msg-texte').value.trim();
  if (!texte) { toast('Écrivez votre message'); return; }
  const btn = $('msg-envoyer');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const res = await rpc('message_ecrire', { p_token: S.token, p_annee: S.annee, p_mois: S.mois, p_texte: texte });
    if (!res.ok) { if (res.erreur === 'session') return sessionPerdue(); toast(res.erreur, 3500); return; }
    $('msg-texte').value = '';
    await chargerMessages();
    toast('✓ Message envoyé');
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = 'Envoyer'; }
}
function renderEquipe() {
  const map = ptgMap();
  // Les employés désactivés qui ont des heures ce mois restent visibles :
  // leurs pointages doivent pouvoir être contrôlés et exportés.
  // La Direction (admin) n'a pas de feuille de temps : elle valide, sauf si
  // des heures ont été saisies sur son compte.
  const actifs = S.employes.filter(e =>
    (e.actif || Object.keys(map[e.id] || {}).length) && e.role !== 'compta' &&
    (e.role !== 'admin' || Object.keys(map[e.id] || {}).length));
  const jours = joursDuMois(S.annee, S.mois);
  const auj = aujourdhui();
  const lecture = S.lecture;
  // Feuille de temps façon Jibble : une ligne par employé, une colonne par jour.
  let html = '<div class="defile"><table class="grille"><tr><th>Employé</th><th>Total</th><th>Solde</th><th>H. sup</th><th>Statut</th>' +
    jours.map(j => '<th class="' + ((j.js === 0 || j.js === 6) ? 'we-th' : '') + (j.iso === auj ? ' auj-th' : '') + '">' +
      JS_COURT[j.js].slice(0, 2) + '<br>' + j.num + '</th>').join('') + '</tr>';
  for (const e of actifs) {
    const mapE = map[e.id] || {};
    const lignes = Object.values(mapE);
    let tot = 0;
    for (const p of lignes) tot += jourMin(p);
    const solde = tot - heuresDues(jours, mapE);
    let supE = 0;
    for (const p of lignes) {
      const [aS, mS, dS] = p.jour.split('-').map(Number);
      supE += heuresSupJour(p, p.jour, new Date(aS, mS - 1, dS).getDay());
    }
    const tous = lignes.length > 0 && lignes.every(p => p.approuve);
    const statut = !lignes.length ? '<span class="muet">—</span>' :
      tous ? '<span class="pill val">Validé</span>' : '<span class="pill att">En attente</span>';
    const action = (lignes.length && !lecture) ?
      '<button class="btn-val-lien" data-emp="' + e.id + '" data-app="' + (tous ? '0' : '1') + '">' +
      (tous ? 'Déverrouiller' : 'Valider le mois') + '</button>' : '';
    html += '<tr><td><button class="emp-lien" data-emp="' + e.id + '" title="Voir le détail du mois">' +
      esc(e.prenom) + (e.nom ? ' ' + esc(e.nom[0]) + '.' : '') + ' ›</button>' +
      (e.actif ? '' : '<span class="muet">(désactivé)</span>') + action + '</td>' +
      '<td class="tot-cell">' + (tot ? fmtMin(tot) : '—') + '</td>' +
      '<td class="tot-cell" style="color:' + (solde >= 0 ? '#047857' : '#b91c1c') + '">' + fmtSolde(solde) + '</td>' +
      '<td class="tot-cell" style="color:#047857">' + (supE ? '+' + fmtMin(supE) : '—') + '</td>' +
      '<td>' + statut + '</td>';
    for (const j of jours) {
      const p = mapE[j.iso];
      const we = j.js === 0 || j.js === 6;
      const min = jourMin(p);
      const fer = ferieGE(j.iso);
      const manque = !p && !we && j.iso < auj && !fer;
      let contenu = '';
      if (!p && fer) contenu = '<span class="badge" style="background:' + COULEURS.ferie + '" title="' + esc(fer) + '">FÉR</span>';
      if (p) {
        const morceaux = [];
        if (min) morceaux.push(fmtMin(min));
        for (const t of [p.matin_type, p.apm_type]) {
          if (t !== 'travail') morceaux.push('<span class="badge" style="background:' + COULEURS[t] + '">' + BADGES[t] + '</span>');
        }
        contenu = morceaux.join('<br>');
        if (!contenu && (p.matin_debut || p.apm_debut)) contenu = '<span class="muet">…</span>';
      }
      html += '<td class="cellule' + (we ? ' we-td' : '') + (j.iso === auj ? ' auj-td' : '') +
        (p && p.approuve ? ' ok-td' : '') + (manque ? ' manque-td' : '') +
        '" data-emp="' + e.id + '" data-jour="' + j.iso + '">' + contenu + '</td>';
    }
    html += '</tr>';
  }
  html += '</table></div>';
  html += lecture
    ? '<div class="muet" style="margin-top:8px">Touchez le <b>nom</b> d’un collaborateur pour voir son mois jour par jour. Fond vert = jour validé par la direction · fond jaune = jour ouvré non encore saisi. Cette page se met à jour automatiquement dès qu’une saisie est ajoutée.</div>'
    : '<div class="muet" style="margin-top:8px">Touchez le <b>nom</b> d’un employé pour examiner son mois en détail avant de valider. Cliquez sur une case pour saisir ou corriger un jour. Fond vert = validé (verrouillé pour l’employé) · fond jaune = jour ouvré non saisi · Solde = heures pointées moins les 8h00 dues par jour ouvré écoulé (absences déduites).</div>';
  $('ong-equipe').innerHTML = html;
  if (!lecture) $('ong-equipe').querySelectorAll('.cellule').forEach(td =>

  $('ong-equipe').querySelectorAll('.emp-lien').forEach(b =>

function ouvrirDetails(empId) {
  DET.empId = empId;

  if (!e) return;
  const map = ptgMap()[empId] || {};

  const jours = joursDuMois(S.annee, S.mois);
  const auj = aujourdhui();
  $('det-titre').textContent = nomComplet(e);
  $('det-sous').textContent = (e.metier ? e.metier + ' — ' : '') + MOIS[S.mois - 1] + ' ' + S.annee +
    ' · CCT ' + cctDe(e).nom;
  $('det-aide').hidden = S.lecture;
  let total = 0;
  for (const p of lignes) total += jourMin(p);
  $('det-total').textContent = fmtMin(total);
  const abs = resumeAbsences(lignes);
  const solde = total - heuresDues(jours, map);
  const manq = joursManquants(jours, map);
  let supMois = 0;
  for (const p of lignes) {
    const [aS, mS, dS] = p.jour.split('-').map(Number);
    supMois += heuresSupJour(p, p.jour, new Date(aS, mS - 1, dS).getDay());
  }
  let chips = '<span style="background:' + (solde >= 0 ? '#e7f6ef;color:#047857' : '#fee2e2;color:#b91c1c') +
    '" title="8h00 dues par jour ouvré passé, absences déduites">Solde : ' + fmtSolde(solde) + '</span>';
  if (supMois) chips += '<span style="background:#e7f6ef;color:#047857">Heures sup : +' + fmtMin(supMois) + '</span>';
  chips += Object.entries(abs).map(([t, n]) => '<span>' + TYPES[t] + ' : ' + fmtJours(n) + '</span>').join('');
  if (manq) chips += '<span style="background:#fef3c7;color:#92400e">⚠ ' + manq + ' jour' + (manq > 1 ? 's' : '') + ' à compléter</span>';
  const tous = lignes.length > 0 && lignes.every(p => p.approuve);
  if (tous) chips += '<span style="background:#ecfdf5;color:#065f46">✓ Mois validé</span>';
  $('det-chips').innerHTML = chips;
  // Fiches horaires façon Jibble : jours + sous-total à la fin de chaque semaine.
  let htmlDet = '', semMin = 0, semSup = 0, semDebut = null;
  for (const j of jours) {
    const p = map[j.iso];
    const we = j.js === 0 || j.js === 6;
    const min = jourMin(p);
    const fer = ferieGE(j.iso);
    const sup = heuresSupJour(p, j.iso, j.js);
    const manque = !p && !we && j.iso < auj && !fer;
    if (semDebut === null) semDebut = j.num;
    semMin += min;
    semSup += sup;
    const coche = p ? '<span class="val-jour' + (p.approuve ? ' on' : '') + '" data-jour="' + j.iso +
      '" title="' + (p.approuve ? 'Déverrouiller ce jour' : 'Valider ce jour') + '">✓</span>' : '';
    htmlDet += '<button class="jour-ligne ' + (we ? 'we' : '') + (j.iso === auj ? ' auj' : '') + (manque ? ' manque' : '') + '" data-jour="' + j.iso + '">' +
      '<div class="date"><div class="js">' + JS_COURT[j.js] + '</div><div class="num">' + j.num + '</div></div>' +
      '<div class="contenu"><div class="heures-txt">' + (p ? heuresTexte(p) : (fer ? badgeFerie(fer) : '<span class="vide">—</span>')) + '</div>' +
      (p && p.remarque ? '<div class="rem">' + esc(p.remarque) + '</div>' : '') + '</div>' +
      '<div class="tot">' + (min ? fmtMin(min) : '') +
      (sup ? ' <span class="delta-sup">+' + fmtMin(sup) + '</span>' : '') + '</div>' + coche + '</button>';
    if (j.js === 0 || j.num === jours.length) { // fin de semaine (dimanche) ou fin de mois
      if (semMin > 0) {
        htmlDet += '<div class="sem-sub"><span>Semaine ' + semDebut + '–' + j.num + ' ' + MOIS[S.mois - 1] + '</span><span>' + fmtMin(semMin) +
          (semSup ? ' <span class="delta-sup">dont +' + fmtMin(semSup) + ' sup</span>' : '') + '</span></div>';
      }
      semMin = 0; semSup = 0; semDebut = null;
    }
  }
  $('det-liste').innerHTML = htmlDet;
  if (!S.lecture) {
    $('det-liste').querySelectorAll('.jour-ligne').forEach(b =>
      b.addEventListener('click', () => { fermerDetails(); ouvrirJour(empId, b.dataset.jour); }));
    $('det-liste').querySelectorAll('.val-jour').forEach(s =>
      s.addEventListener('click', ev => {
        ev.stopPropagation();
        approuverJourRevue(empId, s.dataset.jour, !s.classList.contains('on'));
      }));
  }
  const btn = $('det-valider');
  if (!lignes.length || S.lecture) {
    btn.hidden = true;
  } else {
    btn.hidden = false;
    btn.className = 'btn ' + (tous ? 'sec' : 'vert');
    btn.textContent = tous ? '🔓 Déverrouiller le mois' : '✓ Valider le mois';
    btn.dataset.app = tous ? '0' : '1';
  }
  $('voile-det').classList.add('ouvert');
}

    'Heures en +', 'Heures en −']
    .concat(majDefs.map(d => d.h + ' +' + pourcent(d.t)))
    .concat(['Remarque']);
  const minis = [12, 7, 22, 12, 11, 17, 16, 18, 13, 17, 13, 12, 12]
    .concat(majDefs.map(() => 13)).concat([26]);
  const nCol = enTetes.length;
  aoa.push([cel(S.entreprise || 'Relevé d’heures', STY.titre)]);
  aoa.push([cel(titreMois.toUpperCase(), STY.mois)]);
  aoa.push([cel('Relevé d’heures de ' + nomComplet(emp) + (emp.metier ? ' — ' + emp.metier : ''), STY.titre)]);
  aoa.push([cel('Durée contractuelle : 42 h/semaine (8:24 par jour ouvré écoulé)   ·   CCT : ' + cct.nom +
    ' — ' + cct.conv + ' (' + cct.sem + ' h/semaine)   ·   Plage normale ' + cct.plageDebut + '–' + cct.plageFin +
    ', nuit dès ' + cct.nuitDebut + '   ·   Jours fériés officiels du canton de Genève crédités automatiquement', STY.sous)]);
  aoa.push([]);
  aoa.push(enTetes.map(h => cel(h, STY.th)));
  for (const j of jours) {
    const p = map[j.iso];
    const we = j.js === 0 || j.js === 6;
    const fer = ferieGE(j.iso);
    const passe = j.iso <= auj;
    const min = jourMin(p);
    totTrav += min;
    if (semDebut === null) semDebut = j.num;
    semMin += min;
    if (p) {
      present++;
      if (p.approuve) { nApp++; if (p.approuve_le) dateVal = p.approuve_le; }
      if (demiMin(p.matin_type, p.matin_debut, p.matin_fin) > 0) jt += 0.5;
      if (demiMin(p.apm_type, p.apm_debut, p.apm_fin) > 0) jt += 0.5;
      for (const t of [p.matin_type, p.apm_type]) if (t !== 'travail') absCnt[t] = (absCnt[t] || 0) + 0.5;
    }
    const ferManuel = p && p.matin_type === 'ferie' && p.apm_type === 'ferie';
    const typeJour = (fer || ferManuel) ? 'Férié' : (j.js === 6 ? 'Samedi' : j.js === 0 ? 'Dimanche' : 'Ouvré');
    let code = '';
    if (p) {
      const mt = p.matin_type, at = p.apm_type;
      if (mt !== 'travail' && at !== 'travail') code = mt === at ? CODE_ABS[mt] : CODE_ABS[mt] + ' ½ + ' + CODE_ABS[at] + ' ½';
      else if (mt !== 'travail') code = CODE_ABS[mt] + ' ½';
      else if (at !== 'travail') code = CODE_ABS[at] + ' ½';
    }
    // Heures créditées / dues, base contractuelle, jours écoulés uniquement.
    // Convention du classeur : un jour férié est crédité (8h24) et rien n'est dû ;
    // une absence payée crédite sa demi-journée ; un congé non payé ne crédite rien.
    let cred = 0, dues = 0;
    if (passe) {
      if (typeJour === 'Férié') {
        // Un férié tombant un samedi ou un dimanche ne crédite rien : ce jour-là
        // n'était de toute façon pas travaillé (convention du classeur).
        if (!we) cred = BASE_CONTRAT_MIN;
      } else if (!we) {
        dues = BASE_CONTRAT_MIN;
        if (p) {
          if (p.matin_type !== 'travail' && ABS_PAYEE[p.matin_type]) cred += BASE_CONTRAT_MIN / 2;
          if (p.apm_type !== 'travail' && ABS_PAYEE[p.apm_type]) cred += BASE_CONTRAT_MIN / 2;
        }
      }
    }
    totCred += cred; totDues += dues;
    const ecart = min + cred - dues;
    const enPlus = Math.max(0, ecart), enMoins = Math.max(0, -ecart);
    totPlus += enPlus; totMoins += enMoins;
    const sc = typeJour === 'Férié' ? STY.fer : (we ? STY.we : STY.c);
    const sg = typeJour === 'Férié' ? STY.ferg : (we ? STY.weg : STY.cg);
    const maj = majorationsJour(p, j.iso, j.js, cct);
    for (const d of majDefs) totMaj[d.k] += maj[d.k];
    aoa.push([
      cel(String(j.num).padStart(2, '0') + '.' + String(S.mois).padStart(2, '0') + '.' + S.annee, sc),
      cel(JS_COURT[j.js], sc),
      cel(typeJour === 'Férié' && fer ? 'Férié — ' + fer : typeJour, sc),
      cel(p ? (p.matin_debut || '') : '', sc), cel(p ? (p.matin_fin || '') : '', sc),
      cel(p ? (p.apm_debut || '') : '', sc), cel(p ? (p.apm_fin || '') : '', sc),
      cel(min ? fmtHM(min) : '', sc),
      cel(code, code ? STY.abs : sc),
      cel(cred ? fmtHM(cred) : '', sc),
      cel(dues ? fmtHM(dues) : '', sc),
      enPlus ? cel(fmtDec(enPlus), sc, 'n', '0.00') : cel('', sc),
      enMoins ? cel(fmtDec(enMoins), sc, 'n', '0.00') : cel('', sc)
    ].concat(majDefs.map(d => maj[d.k] ? cel(fmtDec(maj[d.k]), sc, 'n', '0.00') : cel('', sc)))
     .concat([cel(p ? (p.remarque || '') : '', sg)]));
    if (j.js === 0 || j.num === jours.length) { // dimanche ou fin de mois : sous-total hebdomadaire
      if (semMin > 0) {
        const ligne = Array.from({ length: nCol }, () => cel('', STY.sem));
        ligne[2] = cel('Total semaine ' + semDebut + '–' + j.num, STY.sem);
        ligne[7] = cel(fmtHM(semMin), STY.semc);
        aoa.push(ligne);
      }
      semMin = 0; semDebut = null;
    }
  }
  const totaux = Array.from({ length: nCol }, () => cel('', STY.tot));
  totaux[0] = cel('TOTAUX DU MOIS', STY.tot);
  totaux[7] = cel(fmtHM(totTrav), STY.totv);
  totaux[9] = cel(totCred ? fmtHM(totCred) : '', STY.totv);
  totaux[10] = cel(totDues ? fmtHM(totDues) : '', STY.totv);
  totaux[11] = cel(fmtDec(totPlus), STY.totv, 'n', '0.00');
  totaux[12] = cel(fmtDec(totMoins), STY.totv, 'n', '0.00');
  majDefs.forEach((d, i) => { totaux[13 + i] = cel(fmtDec(totMaj[d.k]), STY.totv, 'n', '0.00'); });
  aoa.push(totaux);
  const solde = totTrav + totCred - totDues;
  aoa.push([]);
  const autres = Object.entries(absCnt).filter(([t]) => !['vacances', 'maladie', 'accident'].includes(t))
    .reduce((somme, [, n]) => somme + n, 0);
  aoa.push([cel('Vacances prises : ' + fmtJours(absCnt.vacances || 0) + '   ·   Maladie : ' + fmtJours(absCnt.maladie || 0) +
    '   ·   Accident : ' + fmtJours(absCnt.accident || 0) + '   ·   Autres absences : ' + fmtJours(autres), STY.sous)]);
  aoa.push([cel('Jours travaillés : ' + fmtJours(jt) + '   ·   Solde du mois (travaillé + crédité − dû) : ' + fmtSoldeHM(solde) +
    ' soit ' + (solde / 60).toFixed(2).replace('.', ',') + ' h en décimal', STY.sous)]);
  const detailMaj = majDefs.filter(d => totMaj[d.k] > 0)
    .map(d => d.h + ' +' + pourcent(d.t) + ' : ' + fmtHM(totMaj[d.k]));
  aoa.push([cel('Heures majorées selon la CCT — ' + (detailMaj.length ? detailMaj.join('   ·   ') : 'aucune ce mois'), STY.sous)]);
  const valide = present > 0 && nApp === present;
  aoa.push([cel(valide ? '✓ Validé par la direction' + (dateVal ? ' le ' + dateVal : '')
                       : 'En attente de validation par la direction',
    valide ? { font: { bold: true, sz: 11, color: { rgb: '065F46' } } }
           : { font: { italic: true, sz: 11, color: { rgb: '92400E' } } })]);
  aoa.push([]);
  aoa.push([cel('Signature employé : ______________________', STY.sous), null, null, null, null, null, null,
    cel('Signature direction : ______________________', STY.sous)]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = enTetes.map((h, i) => largeur(h, minis[i]));
  ws['!rows'] = [{ hpt: 20 }, { hpt: 28 }, { hpt: 18 }];
  ws['!merges'] = [0, 1, 2, 3].map(r => ({ s: { r, c: 0 }, e: { r, c: nCol - 1 } }));
  return { ws, totMin: totTrav, totCred, totDues, totPlus, totMoins, totMaj, solde, absCnt, valide, nApp, present, jt, cct };
}
async function exporterExcel() {
  const ids = Array.from($('ong-export').querySelectorAll('input[type=checkbox]:checked')).map(c => c.dataset.id);
  if (!ids.length) { toast('Sélectionnez au moins un employé'); return; }
  const btn = $('btn-export');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Préparation…';
  try {
    await chargerXLSX();
    const map = ptgMap();
    const jours = joursDuMois(S.annee, S.mois);
    const titreMois = MOIS[S.mois - 1] + ' ' + S.annee;
    const wb = XLSX.utils.book_new();
    const enTetesR = ['Employé', 'Métier', 'CCT applicable', 'Heures travaillées', 'Heures créditées',
      'Heures dues', 'Heures en +', 'Heures en −', 'Solde', 'Jours travaillés',
      'Maj. avant plage', 'Maj. après plage', 'Maj. nuit', 'Maj. samedi', 'Maj. dimanche', 'Maj. jour férié',
      'Vacances', 'Maladie', 'Accident', 'Autres absences', 'Validé'];
    const minisR = [24, 14, 26, 18, 17, 13, 12, 12, 10, 16, 17, 17, 11, 13, 14, 16, 11, 10, 11, 16, 9];
    const nColR = enTetesR.length;
    const recap = [];
    recap.push([cel(S.entreprise || 'Relevé d’heures', STY.titre)]);
    recap.push([cel(titreMois.toUpperCase(), STY.mois)]);
    recap.push([cel('Récapitulatif des heures de l’équipe   ·   Base contractuelle : 42 h/semaine (8:24 par jour ouvré écoulé)   ·   Majorations selon la CCT de chaque branche (détail dans l’onglet de chaque collaborateur)', STY.sous)]);
    recap.push([]);
    recap.push(enTetesR.map(h => cel(h, STY.th)));
    const feuilles = [];
    for (const id of ids) {
      const emp = S.employes.find(e => e.id === id);
      if (!emp) continue;
      const f = feuilleEmploye(emp, map[id] || {}, jours, titreMois);
      feuilles.push({ emp, ws: f.ws });
      const autres = Object.entries(f.absCnt).filter(([t]) => !['vacances', 'maladie', 'accident'].includes(t))
        .reduce((somme, [, n]) => somme + n, 0);
      const m = k => (f.totMaj[k] ? cel(fmtDec(f.totMaj[k]), STY.c, 'n', '0.00') : cel('', STY.c));
      recap.push([
        cel(nomComplet(emp), STY.cg), cel(emp.metier || '', STY.cg), cel(f.cct.nom, STY.cg),
        cel(fmtHM(f.totMin), STY.c),
        cel(f.totCred ? fmtHM(f.totCred) : '', STY.c),
        cel(f.totDues ? fmtHM(f.totDues) : '', STY.c),
        cel(fmtDec(f.totPlus), STY.c, 'n', '0.00'),
        cel(fmtDec(f.totMoins), STY.c, 'n', '0.00'),
        cel(fmtSoldeHM(f.solde), STY.c),
        cel(f.jt ? fmtJours(f.jt) : '', STY.c),
        m('avant'), m('apres'), m('nuit'), m('samedi'), m('dimanche'), m('ferie'),
        cel(f.absCnt.vacances ? fmtJours(f.absCnt.vacances) : '', STY.c),
        cel(f.absCnt.maladie ? fmtJours(f.absCnt.maladie) : '', STY.c),
        cel(f.absCnt.accident ? fmtJours(f.absCnt.accident) : '', STY.c),
        cel(autres ? fmtJours(autres) : '', STY.c),
        cel(f.valide ? 'OUI' : (f.nApp > 0 ? 'Partiel' : 'Non'), STY.c)
      ]);
    }
    const wsr = XLSX.utils.aoa_to_sheet(recap);
    wsr['!cols'] = enTetesR.map((h, i) => largeur(h, minisR[i]));
    wsr['!rows'] = [{ hpt: 20 }, { hpt: 28 }, { hpt: 18 }];
    wsr['!merges'] = [0, 1, 2].map(r => ({ s: { r, c: 0 }, e: { r, c: nColR - 1 } }));
    XLSX.utils.book_append_sheet(wb, wsr, 'Récapitulatif ' + MOIS[S.mois - 1]);
    for (const f of feuilles) {
      let nomF = nomComplet(f.emp).replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31) || 'Employé';
      let n = nomF, i = 2;
      while (wb.SheetNames.includes(n)) { n = nomF.slice(0, 28) + ' ' + (i++); }
      XLSX.utils.book_append_sheet(wb, f.ws, n);
    }
    const nomFichier = 'Horaires_' + S.annee + '-' + String(S.mois).padStart(2, '0') +
      (S.entreprise ? '_' + S.entreprise.replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') : '') + '.xlsx';
    XLSX.writeFile(wb, nomFichier);
    toast('✓ Fichier Excel téléchargé');
  } catch (e) { toast(e.message, 4000); }
  finally { btn.disabled = false; btn.textContent = '📥 Télécharger l’Excel pour la comptable'; }
}

/* ---------- Initialisation ---------- */
function init() {
  initLogin();
  initStatuts();
  ['mj-md', 'mj-mf', 'mj-ad', 'mj-af'].forEach(id => {
    $(id).addEventListener('input', majTotalApercu);
    // Champ vide touché → on propose directement l'heure de la journée type.
    $(id).addEventListener('focus', () => {
      if (MJ.verrou || $(id).value) return;
      $(id).value = defPour(id);
      majTotalApercu();
    });
  });
  document.querySelectorAll('.now').forEach(b =>
    b.addEventListener('click', () => { if (MJ.verrou) return; $(b.dataset.cible).value = maintenantHM(); majTotalApercu(); }));
  $('mj-defaut').addEventListener('click', journeeType);
  $('mj-annuler').addEventListener('click', fermerJour);
  $('mj-save').addEventListener('click', sauverJour);
  $('mj-suppr').addEventListener('click', supprimerJour);
  $('mj-approuver').addEventListener('click', approuverJour);
  $('me-annuler').addEventListener('click', () => $('voile-emp').classList.remove('ouvert'));
  $('me-save').addEventListener('click', sauverEmp);
  $('me-regen').addEventListener('click', async () => {
    if (!ME.id) return;
    if (!confirm('Régénérer le lien personnel ? L’ancien lien cessera de fonctionner et l’employé sera déconnecté.')) return;
    try {
      const res = await rpc('admin_regenerer_cle', { p_token: S.token, p_employe: ME.id });
      if (!res.ok) { if (res.erreur === 'session') return sessionPerdue(); toast(res.erreur); return; }
      const e = S.employes.find(x => x.id === ME.id);
      await copierLien(res.cle, e ? e.prenom : '');
      $('voile-emp').classList.remove('ouvert');
      await charger();
    } catch (e) { toast(e.message); }
  });
  $('det-fermer').addEventListener('click', fermerDetails);
  $('det-valider').addEventListener('click', () => {
    const app = $('det-valider').dataset.app === '1';
    fermerDetails();
    approuverMois(DET.empId, app);
  });
  $('btn-pointer').addEventListener('click', journeeTypeAujourdhui);
  $('btn-sortir-emp').addEventListener('click', deconnexion);
  $('btn-sortir-adm').addEventListener('click', deconnexion);
  $('emp-prev').addEventListener('click', () => moisNav(-1));
  $('emp-next').addEventListener('click', () => moisNav(1));
  $('adm-prev').addEventListener('click', () => moisNav(-1));
  $('adm-next').addEventListener('click', () => moisNav(1));
  $('me-role').addEventListener('change', () => {
    $('me-champs-emp').hidden = $('me-role').value === 'compta';
  });
  $('me-cct').addEventListener('change', majCctInfo);
  document.querySelectorAll('.onglets button').forEach(b =>
    b.addEventListener('click', () => {
      S.ongletAdmin = b.dataset.ong;
      if (b.dataset.ong === 'messages') S.msgCharges = false;
      renderAdmin();
    }));
  // Espace fiduciaire : la page se rafraîchit toute seule pour refléter les
  // saisies faites entre-temps par les techniciens.
  setInterval(() => {
    if (!S.token || !estCompta() || document.hidden) return;
    if ($('voile-det').classList.contains('ouvert')) return;
    charger();
    if (S.ongletAdmin !== 'messages') chargerMessages();
  }, 60000);
  [$('voile-jour'), $('voile-emp'), $('voile-det')].forEach(v =>
    v.addEventListener('click', e => { if (e.target === v) v.classList.remove('ouvert'); }));
  const cle = cleDansUrl();
  if (S.token && S.moi) { charger(); }
  else if (cle) { connexionParCle(cle); }
  else { montrer('login'); }
}
init();
